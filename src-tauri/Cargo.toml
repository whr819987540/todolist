[package]
name = "todo-list"
version = "0.1.0"
description = "待办清单 - 工作区 / 项目 / 待办三级管理"
authors = ["whr819987540"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todo_list_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：正文里的本地图片经 asset 协议显示（tauri.conf.json 里同时打开，范围在 lib.rs 的 setup 里按数据目录放开）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
# 设置备份到本地时的「另存为」对话框（只在 Rust 端调用）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"
# 识别用户拷进来的非 UTF-8 正文（GBK、UTF-16）
encoding_rs = "0.8"
# WebDAV 设置备份：HTTPS 用系统自带的 schannel（认 Windows 证书库），zip 只需 deflate，密码存 Windows 凭据管理器
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = { version = "3", features = ["windows-native"] }
roxmltree = "0.21"
percent-encoding = "2"
# 监听数据目录，文件在外部变化时通知主窗口刷新（见 watch.rs）
notify = "8"
# 导出成 HTML / PDF（export.rs）：Markdown 渲染（GFM 的表格、任务列表、删除线、脚注），正文里原始 HTML 的安全处理，
# 本地图片嵌成 base64 的 data URI
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
base64 = "0.22"

# 给窗口补设大图标（见 lib.rs set_window_icons）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# 读 Windows 的代理设置（见 webdav.rs proxy）
windows-registry = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 本机测试用的快速构建（npm run build:fast）：优化级别同 release，但不做 LTO、多代码单元并行、增量编译，
# 二次构建快很多；产物在 target/release-fast/，不打安装包
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
