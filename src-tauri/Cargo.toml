[package]
name = "todo-list"
version = "0.1.0"
description = "待办清单 - 工作区 / 项目 / 待办三级管理"
authors = ["whr819987540"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todo_list_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"
# WebDAV 设置备份：HTTPS 用系统自带的 schannel（认 Windows 证书库），zip 只需 deflate，密码存 Windows 凭据管理器
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = { version = "3", features = ["windows-native"] }
roxmltree = "0.21"
percent-encoding = "2"

# 给窗口补设大图标（见 lib.rs set_window_icons）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# 读 Windows 的代理设置（见 webdav.rs proxy）
windows-registry = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
