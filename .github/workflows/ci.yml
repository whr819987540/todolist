# 每次 push、提 PR 时在 Windows 上检查：ESLint、前端单元测试、前端构建、Rust 单元测试
name: CI

on:
  # 改动的文件全是下面这些（文档、发布流程、编辑器设置）时不跑：它们不进构建，测试也不读；只要有一个别的文件就照常跑。
  # 和 e2e.yml 的同一份清单，改的时候两边一起改
  push:
    # 只认分支：推 tag（发布）时不跑，tag 打在已经在 main 上跑过的提交上，再跑一遍是重复的
    branches: ["**"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  # 每周两次在 main 上定时跑（北京时间周一、周四凌晨 2 点）：GitHub 会删掉 7 天没用过的缓存，main 隔得久了没跑，
  # 新分支就拿不到 Rust 的编译缓存、要从头编 300 多个 crate（多 3 分钟）；顺便早点发现 Windows 机器、Rust 更新后的问题。
  # 和 e2e.yml 一样，改的时候两边一起改
  schedule:
    - cron: "0 18 * * 0,3"

# 同一个分支上新的提交到了，前面还没跑完的就不跑了；定时跑的另算一组，不和推送的互相取消
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # vitest 5 要 Node 22.12 以上（或 24）
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 只在 main 上存：分支用 main 的（GitHub 的缓存按分支隔开，分支能读 main 的），不各存一份 500 多 MB，
      # 免得占满仓库 10 GB 的缓存、把 main 的挤掉
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 前端单元测试
        run: npm test

      - name: 前端构建（tsc + vite build）
        run: npm run build

      # 放在前端构建之后：tauri::generate_context! 在不是 dev 的构建（tauri build）里要把 frontendDist（../dist）
      # 嵌进程序，dist 不在就编译失败。现在的 cargo test 是 dev 构建、用 devUrl，其实不读 dist，
      # 但先构建好，免得以后换了构建方式（release、custom-protocol）时这一步莫名其妙地失败
      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test
