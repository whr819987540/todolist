# 在 GitHub 的 Windows 机器上跑端到端测试（npm run e2e，见 README.md「端到端测试（Windows）」）
name: E2E

on:
  # 改动的文件全是下面这些（文档、发布流程、编辑器设置）时不跑：它们不进构建，测试也不读；只要有一个别的文件就照常跑。
  # 和 ci.yml 的同一份清单，改的时候两边一起改
  push:
    # 只认分支：推 tag（发布）时不跑，tag 打在已经在 main 上跑过的提交上，再跑一遍是重复的
    branches: ["**"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  # 手动跑：Actions 页面，或 gh workflow run e2e.yml --ref <分支> -f suites="batch recycle"
  workflow_dispatch:
    inputs:
      suites:
        description: 只跑这几个套件（空格分开，空着跑全部）
        required: false
        default: ""
  # 每周两次在 main 上定时跑，免得 Rust 的编译缓存放过 7 天被删掉（见 ci.yml 的同一处，改的时候两边一起改）
  schedule:
    - cron: "0 18 * * 0,3"

# 同一个分支上新的提交到了（或手动派了一次），前面还没跑完的就不跑了；定时跑的另算一组，不和推送的互相取消
concurrency:
  group: e2e-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

jobs:
  e2e:
    # 套件分成 4 组，在 4 台机器上同时跑（run.mjs 的 --shard 按估计的耗时分，每个套件正好在一组里），
    # 一个接一个跑要 20 分钟；每组各自装依赖、构建测试版。手动只跑几个套件时一组就够
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.suites && '[1]' || '[1, 2, 3, 4]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 测试版构建在 src-tauri/target/e2e（和 CI 的 cargo test 分开）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/e2e
          cache-on-failure: true
          # 只在 main 上存（同 ci.yml）；几组用的是同一份缓存，只让第 1 组存，不重复上传
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      # 记下机器的情况，测试没通过时对照
      - name: 环境
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $wv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "系统：$((Get-CimInstance Win32_OperatingSystem).Caption)"
          "WebView2：$wv"
          "用户：$env:USERNAME，管理员：$admin，交互式：$([Environment]::UserInteractive)，会话：$((Get-Process -Id $PID).SessionId)"
          "屏幕：$([Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          "explorer：$(@(Get-Process explorer -ErrorAction SilentlyContinue).Count) 个"

      - name: 安装依赖
        run: npm ci

      # 等于 npm run e2e -- --shard=<组>/<几组> [套件…]；直接调 node，套件名一个个作为参数传过去
      - name: 端到端测试
        env:
          SUITES: ${{ inputs.suites }}
        run: node e2e/run.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }} @("$env:SUITES" -split '\s+' | Where-Object { $_ })

      # 没通过时截一张整个桌面的图，看窗口当时的样子
      - name: 截屏
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\desktop.png")

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-${{ matrix.shard }}
          path: ${{ runner.temp }}/desktop.png
          if-no-files-found: ignore
